<!doctype html>
<!--
  GIDZET brand reel: an 18s motion graphic ending on a contact card.
  Landscape 1920×1080 by default; add ?format=vertical for a 1080×1920 (9:16) cut
  with text kept inside Instagram Reels' safe zone.
  Open in a browser to preview (it plays on load), or run `npm run reel` to render
  both cuts to public/motion/.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GIDZET Reel</title>
<script>if (/format=vertical/.test(location.search)) document.documentElement.classList.add("v");</script>
<link rel="stylesheet" href="../node_modules/@fontsource/inter-tight/300.css">
<link rel="stylesheet" href="../node_modules/@fontsource/inter-tight/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/instrument-serif/400-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource/geist-mono/400.css">
<style>
  :root {
    --bg: #07060b;
    --grad: linear-gradient(100deg, #c084fc 0%, #a855f7 30%, #ec4899 70%, #fb7185 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter Tight", sans-serif; color: #f4f2f8; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }
  .center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
  .mono { font-family: "Geist Mono", monospace; }

  /* backdrop */
  .blob { position: absolute; border-radius: 50%; filter: blur(140px); }
  #grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 96px 96px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 50%, #000 20%, transparent 75%);
  }
  #grain {
    position: absolute; inset: -60px; opacity: .07; pointer-events: none; z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  #vignette { position: absolute; inset: 0; z-index: 40; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); }

  /* scene 1 */
  #line { left: 50%; top: 50%; width: 1100px; height: 2px; margin-left: -550px; background: var(--grad); transform-origin: center; box-shadow: 0 0 30px #ec4899; }
  .word { white-space: nowrap; display: flex; }
  .word span { display: inline-block; will-change: transform, filter, opacity; }
  #psych { font-size: 260px; line-height: 1; }

  /* scene 2 */
  #cross { font-size: 140px; font-weight: 300; color: rgba(255,255,255,.4); }
  #code { font-size: 300px; font-weight: 600; letter-spacing: -.05em; line-height: 1; }
  #typed { font-size: 46px; color: #c4b5fd; letter-spacing: .02em; }
  #caret { display: inline-block; width: 22px; height: 52px; background: #ec4899; vertical-align: -8px; margin-left: 6px; }

  /* scene 3 */
  #curve { left: 50%; top: 50%; width: 1200px; height: 520px; margin: -330px 0 0 -600px; overflow: visible; }
  .shape { position: absolute; left: 50%; top: 50%; }
  #s-circle { width: 150px; height: 150px; margin: -75px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8b4fe, #a855f7 60%, #6d28d9); }
  #s-square { width: 140px; height: 140px; margin: -70px; border-radius: 34px; background: radial-gradient(circle at 35% 30%, #fbcfe8, #ec4899 60%, #9d174d); }
  #s-tri { width: 160px; height: 140px; margin: -70px -80px; background: linear-gradient(160deg, #fde68a, #f59e0b 60%, #b45309); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  #trio { font-size: 64px; font-weight: 600; letter-spacing: -.03em; display: flex; gap: 36px; }
  #trio .dot { color: #ec4899; }

  /* scene 4 */
  #orb {
    left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px; border-radius: 50%;
    background:
      radial-gradient(60% 40% at 35% 18%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(circle at 70% 85%, rgba(251,113,133,.9), transparent 55%),
      linear-gradient(135deg, #a855f7, #ec4899);
    box-shadow: inset 0 3px 2px rgba(255,255,255,.6), inset 0 -10px 30px rgba(255,255,255,.18), 0 40px 120px -20px rgba(236,72,153,.6);
    display: grid; place-items: center;
  }
  #g { font-size: 230px; line-height: 1; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.25); margin-top: -10px; }
  #wordmark { font-size: 210px; font-weight: 600; letter-spacing: -.05em; line-height: 1; }
  #tagline { font-size: 44px; font-weight: 300; color: rgba(244,242,248,.75); display: flex; gap: 14px; }
  #tagline .serif { font-size: 52px; }
  #sweep { position: absolute; top: -20%; width: 260px; height: 140%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); mix-blend-mode: overlay; }
  #pill { font-size: 26px; display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-radius: 999px; background: #fff; color: #07060b; font-weight: 600; }
  /* ─── 9:16 cut ─── */
  .v, .v body, .v #stage { width: 1080px; height: 1920px; }
  .v #line { width: 800px; margin-left: -400px; }
  .v #psych { font-size: 196px; }
  .v #cross { font-size: 110px; }
  .v #code { font-size: 270px; }
  .v #typed { font-size: 50px; }
  .v #curve { width: 960px; height: 416px; margin: -300px 0 0 -480px; }
  .v #trio { font-size: 58px; gap: 22px; top: 64% !important; }
  .v #trio .serif { font-size: 68px !important; }
  .v #brand > div { flex-direction: column; gap: 28px !important; }
  .v #brand > div > div:last-child { padding: 10px 10px 20px !important; }
  .v #wordmark { font-size: 200px; }
  .v #tagline { top: 63% !important; width: 880px; flex-wrap: wrap; justify-content: center; row-gap: 4px; font-size: 50px; text-align: center; }
  .v #tagline .serif { font-size: 60px; }
  .v #pill { top: 73% !important; font-size: 30px; }
  .v #c-tl, .v #c-tr { top: 250px !important; }
  .v #c-bl, .v #c-br { bottom: 400px !important; }
  .v #c-bl { font-size: 17px; }
  .v #b1 { left: -350px !important; top: 100px !important; }
  .v #b2 { right: -350px !important; bottom: 200px !important; }
  .v #b3 { left: 15% !important; top: 45% !important; }
  #pill i { width: 14px; height: 14px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 6px rgba(74,222,128,.25); }
  .corner { font-size: 20px; letter-spacing: .3em; color: rgba(255,255,255,.4); text-transform: uppercase; }
  /* scene 5 · contact card */
  #contact {
    left: 50%; top: 68%; transform: translate(-50%, -50%); width: 980px;
    padding: 40px 56px 44px; border-radius: 40px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 40px rgba(255,255,255,.05), 0 40px 100px -30px rgba(0,0,0,.7);
    backdrop-filter: blur(24px) saturate(160%);
  }
  #contact .kicker { font-size: 64px; line-height: 1; margin-bottom: 26px; }
  #contact .row { display: flex; align-items: center; gap: 26px; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.1); }
  #contact .ic { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #a855f7, #ec4899); box-shadow: inset 0 2px 1px rgba(255,255,255,.5); }
  #contact .ic svg { width: 30px; height: 30px; }
  #contact .lab { font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: .28em; color: rgba(255,255,255,.5); text-transform: uppercase; }
  #contact .val { font-size: 44px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  #csweep { position: absolute; top: -10%; left: 0; width: 220px; height: 120%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent); transform: skewX(-20deg); }
  .v #contact { top: 62%; width: 900px; padding: 40px 44px 44px; }
  .v #contact .kicker { font-size: 76px; text-align: center; }
  .v #contact .val { font-size: 46px; }

  #fade { position: absolute; inset: 0; background: var(--bg); z-index: 45; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="width:900px;height:900px;left:-200px;top:-150px;background:rgba(168,85,247,.35)"></div>
  <div class="blob" id="b2" style="width:800px;height:800px;right:-200px;bottom:-250px;background:rgba(236,72,153,.3)"></div>
  <div class="blob" id="b3" style="width:600px;height:600px;left:40%;top:40%;background:rgba(99,102,241,.22)"></div>
  <div id="grid"></div>

  <!-- corners -->
  <div class="abs corner mono" id="c-tl" style="left:72px;top:60px">Gidzet ©2026</div>
  <div class="abs corner mono" id="c-tr" style="right:72px;top:60px">00:00</div>
  <div class="abs corner mono" id="c-bl" style="left:72px;bottom:60px">Psychology · Code · Design · Motion</div>
  <div class="abs corner mono" id="c-br" style="right:72px;bottom:60px">Accra, GH</div>

  <!-- scene 1 -->
  <div id="line" class="abs"></div>
  <div id="psych" class="abs center word serif"></div>

  <!-- scene 2 -->
  <div id="s2" class="abs center" style="text-align:center">
    <div style="display:flex;align-items:center;justify-content:center;gap:40px">
      <span id="cross">×</span>
      <div id="code" class="word"></div>
    </div>
    <div class="mono" id="typedwrap" style="margin-top:30px"><span id="typed"></span><span id="caret"></span></div>
  </div>

  <!-- scene 3 -->
  <svg id="curve" class="abs" viewBox="0 0 1200 520">
    <defs>
      <linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    </defs>
    <g id="curvegrid" stroke="rgba(255,255,255,.07)">
      <line x1="0" x2="1200" y1="40" y2="40"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="400" y2="400"/><line x1="0" x2="1200" y1="480" y2="480"/>
    </g>
    <line id="h1" x1="40" y1="480" x2="520" y2="480" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="6 8"/>
    <line id="h2" x1="1160" y1="40" x2="680" y2="40" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="6 8"/>
    <circle id="k1" cx="520" cy="480" r="12" fill="#a855f7"/>
    <circle id="k2" cx="680" cy="40" r="12" fill="#ec4899"/>
    <path id="path" d="M40 480 C 520 480, 680 40, 1160 40" fill="none" stroke="url(#cg)" stroke-width="8" stroke-linecap="round"/>
    <rect id="diamond" x="-16" y="-16" width="32" height="32" rx="5" fill="#fff" transform="rotate(45)" style="filter:drop-shadow(0 0 18px #ec4899)"/>
    <text id="ease" x="1160" y="10" text-anchor="end" font-family="Geist Mono" font-size="20" fill="rgba(255,255,255,.5)" letter-spacing="3">CUBIC-BEZIER(.65, 0, .35, 1)</text>
  </svg>
  <div id="s-circle" class="shape"></div>
  <div id="s-square" class="shape"></div>
  <div id="s-tri" class="shape"></div>
  <div id="trio" class="abs" style="left:50%;top:78%;transform:translateX(-50%)">
    <span>Design</span><span class="dot">✦</span><span>Code</span><span class="dot">✦</span><span class="serif grad" style="font-weight:400;font-size:76px">Motion</span>
  </div>

  <!-- scene 4 -->
  <div id="orb" class="abs"><span id="g" class="serif">G</span></div>
  <div id="brand" class="abs" style="left:50%;top:50%;transform:translate(-50%,-50%)">
    <div style="display:flex;align-items:center;gap:56px">
      <div style="width:300px;height:300px;flex:none" id="orbslot"></div>
      <div style="position:relative;overflow:hidden;padding:10px 20px 20px 0">
        <div id="wordmark" class="word"></div>
        <div id="sweep"></div>
      </div>
    </div>
  </div>
  <div id="tagline" class="abs" style="left:50%;top:74%;transform:translateX(-50%)"></div>
  <div id="pill" class="abs" style="left:50%;top:85%;transform:translateX(-50%)"><i></i>Available for work</div>

  <div id="contact" class="abs">
    <div id="csweep"></div>
    <div class="kicker serif grad">Let&rsquo;s work together</div>
    <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3 7 9 6 9-6"/></svg></span><div><div class="lab">Email</div><div class="val">adontenggideon57@gmail.com</div></div></div>
    <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span><div><div class="lab">Phone</div><div class="val">+233 50 030 3230</div></div></div>
  </div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const split = (el, text, cls = "") => {
    el.innerHTML = [...text].map((c) => `<span class="${cls}">${c === " " ? "&nbsp;" : c}</span>`).join("");
    return el.querySelectorAll("span");
  };

  const psych = split($("#psych"), "Psychology", "grad");
  const code = split($("#code"), "Code");
  const wordmark = split($("#wordmark"), "GIDZET");
  wordmark.forEach((s, i) => { if (i >= 3) s.classList.add("grad"); });
  $("#tagline").innerHTML = ["Engineering", '<span class="serif grad">Human‑Centric</span>', "Digital", "Solutions."]
    .map((w) => `<span style="display:inline-block">${w}</span>`).join("");
  const tagWords = $("#tagline").children;
  const typedText = "<HumanCentric />";

  const VERTICAL = document.documentElement.classList.contains("v");
  const W = VERTICAL ? 1080 : 1920, H = VERTICAL ? 1920 : 1080;
  const DURATION = 18;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });

  /* ─── always-on backdrop drift ─── */
  tl.to("#b1", { x: 260, y: 140, duration: DURATION, ease: "sine.inOut" }, 0)
    .to("#b2", { x: -300, y: -120, duration: DURATION, ease: "sine.inOut" }, 0)
    .to("#b3", { x: -220, y: 160, scale: 1.4, duration: DURATION, ease: "sine.inOut" }, 0)
    .to("#grid", { backgroundPosition: "96px 192px", duration: DURATION, ease: "none" }, 0)
    .to("#grain", { x: 40, y: -30, duration: DURATION, ease: "steps(120)" }, 0)
    .fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);

  /* ─── 1 · Psychology ─── */
  gsap.set(["#s2", "#curve", ".shape", "#trio", "#orb", "#brand", "#tagline", "#pill", "#contact"], { opacity: 0 });
  tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 0.2)
    .to("#line", { scaleY: 60, opacity: 0, duration: 0.7, ease: "expo.in" }, 1.0)
    .fromTo(psych, { yPercent: 110, opacity: 0, filter: "blur(18px)", rotate: 8 },
      { yPercent: 0, opacity: 1, filter: "blur(0px)", rotate: 0, duration: 1.1, stagger: 0.045 }, 1.25)
    .to("#psych", { scale: 1.06, duration: 2, ease: "none" }, 1.25)
    .to(psych, { yPercent: -120, opacity: 0, filter: "blur(12px)", duration: 0.55, stagger: 0.02, ease: "expo.in" }, 2.75);

  /* ─── 2 · × Code ─── */
  tl.set("#s2", { opacity: 1 }, 3.2)
    .fromTo("#cross", { scale: 0, rotate: -180 }, { scale: 1, rotate: 0, duration: 0.9, ease: "back.out(2)" }, 3.2)
    .fromTo(code, { y: -420, opacity: 0, scaleY: 1.4 }, { y: 0, opacity: 1, scaleY: 1, duration: 0.9, stagger: 0.08, ease: "bounce.out" }, 3.3)
    .fromTo("#typedwrap", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.0);
  const typer = { n: 0 };
  tl.to(typer, { n: typedText.length, duration: 1.0, ease: `steps(${typedText.length})`, onUpdate: () => { $("#typed").textContent = typedText.slice(0, Math.round(typer.n)); } }, 4.1);
  tl.to("#caret", { opacity: 0, duration: 0.01, repeat: 7, yoyo: true, repeatDelay: 0.24, ease: "none" }, 4.0)
    .to("#s2", { scale: 0.85, opacity: 0, filter: "blur(16px)", duration: 0.6, ease: "expo.in" }, 5.7);

  /* ─── 3 · Motion ─── */
  const path = $("#path");
  const len = path.getTotalLength();
  gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
  gsap.set(["#h1", "#h2", "#k1", "#k2", "#ease", "#diamond"], { opacity: 0 });
  tl.set("#curve", { opacity: 1 }, 6.2)
    .fromTo("#curvegrid", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.2)
    .to(["#h1", "#h2"], { opacity: 1, duration: 0.3 }, 6.3)
    .fromTo(["#k1", "#k2"], { scale: 0, opacity: 1, transformOrigin: "center" }, { scale: 1, duration: 0.5, ease: "back.out(3)", stagger: 0.1 }, 6.35)
    .to("#ease", { opacity: 1, duration: 0.4 }, 6.5)
    .to(path, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 6.4)
    .set("#diamond", { opacity: 1 }, 6.4);
  const rider = { p: 0 };
  tl.to(rider, {
    p: 1, duration: 1.3, ease: "power2.inOut",
    onUpdate: () => {
      const pt = path.getPointAtLength(rider.p * len);
      $("#diamond").setAttribute("transform", `translate(${pt.x} ${pt.y}) rotate(45)`);
    },
  }, 6.4);

  // shapes pop in with squash & stretch, then settle into a row
  const shapes = ["#s-circle", "#s-square", "#s-tri"];
  const xs = VERTICAL ? [-300, 0, 300] : [-360, 0, 360];
  tl.to("#curve", { y: -130, scale: 0.7, opacity: 0.35, duration: 0.8, ease: "expo.inOut" }, 7.7);
  shapes.forEach((s, i) => {
    const t = 7.9 + i * 0.12;
    tl.set(s, { opacity: 1, x: xs[i], y: 700 }, t)
      .to(s, { y: 40, duration: 0.45, ease: "power2.out" }, t)
      .to(s, { scaleY: 1.25, scaleX: 0.8, duration: 0.15, ease: "power1.out" }, t)
      .to(s, { scaleY: 0.7, scaleX: 1.3, duration: 0.12, ease: "power1.in" }, t + 0.45)
      .to(s, { y: 60, scale: 1, scaleX: 1, scaleY: 1, rotate: i === 1 ? 90 : 0, duration: 0.9, ease: "elastic.out(1, .45)" }, t + 0.57);
  });
  tl.fromTo("#trio", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8 }, 8.5)
    .fromTo("#trio > span", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, stagger: 0.07, duration: 0.7 }, 8.5);

  /* ─── 4 · Logo ─── */
  // shapes converge, the curve and words leave, an orb is born
  tl.to("#curve", { opacity: 0, duration: 0.4 }, 9.5)
    .to("#trio", { opacity: 0, y: 30, filter: "blur(10px)", duration: 0.4, ease: "expo.in" }, 9.5)
    .to(shapes, { x: 0, y: 0, rotate: 180, scale: 0.4, duration: 0.6, ease: "expo.in" }, 9.55)
    .to(shapes, { opacity: 0, duration: 0.1 }, 10.12)
    .set("#orb", { opacity: 1 }, 10.12)
    .fromTo("#orb", { scale: 0.2 }, { scale: 1.15, duration: 0.5, ease: "back.out(2.5)" }, 10.12)
    .to("#orb", { scale: 1, duration: 0.4, ease: "power2.out" }, 10.62)
    .fromTo("#g", { scale: 0, rotate: -30 }, { scale: 1, rotate: 0, duration: 0.7, ease: "back.out(2)" }, 10.3);

  // orb slides left to make room for the wordmark
  // measured once, when the lock-up first forms, so later scenes (and seeks) reuse the same spot
  let orbSlot = null;
  const measureSlot = () => {
    if (!orbSlot) {
      const r = $("#orbslot").getBoundingClientRect();
      orbSlot = { x: r.left + r.width / 2 - W / 2, y: r.top + r.height / 2 - H / 2 };
    }
    return orbSlot;
  };
  const slot = (axis) => () => measureSlot()[axis];
  tl.set("#brand", { opacity: 1, y: VERTICAL ? -190 : -60 }, 10.9)
    .to("#orb", { x: slot("x"), y: slot("y"), duration: 0.9, ease: "expo.inOut" }, 10.9)
    .fromTo(wordmark, { yPercent: 120, opacity: 0, rotateX: -80 }, { yPercent: 0, opacity: 1, rotateX: 0, duration: 0.9, stagger: 0.06 }, 11.2)
    .fromTo("#sweep", { x: -300 }, { x: 1300, duration: 1.1, ease: "power2.inOut" }, 12.0)
    .set("#tagline", { opacity: 1 }, 11.6)
    .fromTo(tagWords, { yPercent: 100, opacity: 0, filter: "blur(8px)" }, { yPercent: 0, opacity: 1, filter: "blur(0px)", stagger: 0.08, duration: 0.8 }, 11.6)
    .fromTo("#pill", { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(2.2)" }, 12.2)

  /* ─── 5 · Contact card ─── */
  // logo lock-up lifts and shrinks; the orb follows the wordmark's new geometry
  const BY = VERTICAL ? -190 : -60;           // brand offset set above
  const DY = VERTICAL ? -250 : -205;          // extra lift
  const S = VERTICAL ? 0.72 : 0.6;            // lock-up scale
  const orbAt = measureSlot;
  tl.to(["#tagline", "#pill"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.45, ease: "expo.in" }, 13.4)
    .to("#brand", { y: BY + DY, scale: S, duration: 0.9, ease: "expo.inOut" }, 13.55)
    .to("#orb", {
      x: () => S * orbAt().x,
      y: () => BY + DY + S * (orbAt().y - BY),
      scale: S, duration: 0.9, ease: "expo.inOut",
    }, 13.55)
    .fromTo("#contact", { opacity: 0, y: 80, scale: 0.94, filter: "blur(14px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1, ease: "expo.out" }, 13.95)
    .fromTo("#contact .kicker", { yPercent: 80, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.8 }, 14.1)
    .fromTo("#contact .row", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, stagger: 0.22 }, 14.35)
    .fromTo("#contact .ic", { scale: 0, rotate: -90 }, { scale: 1, rotate: 0, duration: 0.7, stagger: 0.22, ease: "back.out(2.4)" }, 14.4)
    .fromTo("#csweep", { x: -300 }, { x: 1200, duration: 1.3, ease: "power2.inOut" }, 15.6)
    .to("#fade", { opacity: 1, duration: 0.7, ease: "power2.in" }, DURATION - 0.7);

  tl.eventCallback("onUpdate", () => {
    const t = tl.time();
    $("#c-tr").textContent = `00:${String(Math.floor(t)).padStart(2, "0")}:${String(Math.floor((t % 1) * 30)).padStart(2, "0")}`;
  });

  // Renderer hook: seek to an exact time for frame-perfect capture
  window.reel = { duration: DURATION, seek: (t) => { tl.seek(t, false); } };
  document.fonts.ready.then(() => {
    window.reel.ready = true;
    if (!navigator.webdriver) tl.play().repeat(-1);
  });
  tl.repeat(0);
</script>
</body>
</html>
